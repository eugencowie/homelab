name: Build Caddy

on:
  push:
    branches: [main]
    paths: [images/caddy/**]
  pull_request:
    # Also the workflow itself, to test changes to it; push leaves it out so they don't republish the image
    paths: [images/caddy/**, .github/workflows/build-caddy.yml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Caddy version
        id: version
        run: |
          version=$(grep -oP '^FROM caddy:\K[0-9.]+(?=@)' images/caddy/Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The version tag moves with each build so Renovate can bump the digest pinned for deployment
      - name: Get metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/caddy
          tags: type=raw,value=${{ steps.version.outputs.version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/caddy
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No attestation, so the tag points straight at the arm64 image rather than an index
          provenance: false

      # Let Renovate open the PR that deploys the new digest without waiting for its schedule
      - name: Trigger Renovate
        if: github.ref == 'refs/heads/main'
        run: gh workflow run renovate.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
