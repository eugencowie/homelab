name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@v5.2.3
        with:
          install_args: docker-compose jactionlint shellcheck

      # lint:ansible is left out because its syntax check needs the vault password
      - name: Lint
        run: 'mise run --skip-tools lint:actions ::: lint:stacks'
