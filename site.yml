- name: Configure Swarm
  hosts: swarm
  become: true
  roles:
    - swarm
    - tmux

- name: Configure Raspberry Pi 5
  hosts: raspberry-pi-5
  become: true
  vars_files:
    - vault/caddy.yml
    - vault/bitwarden.yml
    - vault/davinci.yml
    - vault/karakeep.yml
    - vault/samba.yml
    - vault/stash.yml
    - vault/tailscale.yml
  roles:
    - caddy
    - actual
    - adguard
    - bitwarden
    - davinci
    - heimdall
    - karakeep
    - n8n
    - nextcloud
    - paperless
    - samba
    - sillytavern
    - stash
    - tailscale
