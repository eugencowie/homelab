- name: Configure Swarm
  hosts: swarm
  become: true
  roles:
    - swarm
    - tmux

- name: Configure Raspberry Pi 5
  hosts: raspberry-pi-5
  become: true
  module_defaults:
    community.docker.docker_stack:
      detach: false
  vars_files:
    - vault/caddy.yml
    - vault/bitwarden.yml
    - vault/davinci.yml
    - vault/karakeep.yml
    - vault/samba.yml
    - vault/stash.yml
    - vault/tailscale.yml
    - vault/woodpecker.yml
  roles:
    - { role: caddy, caddy_version: 2.11.1 } # renovate: docker=caddy
    - { role: actual, actual_version: 26.2.1 } # renovate: docker=actualbudget/actual-server
    - { role: adguard, adguard_version: 0.107.72 } # renovate: docker=adguard/adguardhome
    - { role: bitwarden, bitwarden_version: 1.35.4 } # renovate: docker=vaultwarden/server
    - { role: davinci, davinci_version: 13.23 } # renovate: docker=postgres
    - { role: glance, glance_version: 0.8.4 } # renovate: docker=glanceapp/glance
    - { role: heimdall, heimdall_version: 2.7.6 } # renovate: docker=linuxserver/heimdall
    - { role: jellyfin, jellyfin_version: 10.11.6 } # renovate: docker=jellyfin/jellyfin
    - { role: n8n, n8n_version: 2.12.2 } # renovate: docker=n8nio/n8n
    - { role: nextcloud, nextcloud_version: 33.0.0 } # renovate: docker=linuxserver/nextcloud
    - { role: openwebui, openwebui_version: v0.8.10 } # renovate: docker=ghcr.io/open-webui/open-webui
    - { role: samba, samba_version: latest } # renovate: docker=dperson/samba
    - { role: sillytavern, sillytavern_version: 1.16.0 } # renovate: docker=ghcr.io/sillytavern/sillytavern
    - { role: stash, stash_version: 1.73.1 } # renovate: docker=rclone/rclone
    - { role: tailscale, tailscale_version: 1.94.2 } # renovate: docker=tailscale/tailscale
    - { role: woodpecker, woodpecker_version: 3.13.0 } # renovate: docker=woodpeckerci/woodpecker-server
    - role: karakeep
      karakeep_version: 0.31.0 # renovate: docker=ghcr.io/karakeep-app/karakeep
      karakeep_chrome_version: 124 # renovate: docker=gcr.io/zenika-hub/alpine-chrome
      karakeep_meili_version: 1.13.3 # renovate: docker=getmeili/meilisearch
    - role: paperless
      paperless_version: 2.20.9 # renovate: docker=ghcr.io/paperless-ngx/paperless-ngx
      paperless_redis_version: 8.6.1 # renovate: docker=redis
      paperless_tika_version: 3.2.3.0 # renovate: docker=apache/tika
      paperless_gotenberg_version: 8.26.0 # renovate: docker=gotenberg/gotenberg
