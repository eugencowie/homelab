- name: Configure Swarm
  hosts: swarm
  become: true
  roles:
    - swarm
    - tmux

- name: Configure Raspberry Pi 5
  hosts: raspberry-pi-5
  become: true
  module_defaults:
    community.docker.docker_stack:
      detach: false
  vars_files:
    - vault/caddy.yml
    - vault/bitwarden.yml
    - vault/hermes.yml
    - vault/matrix.yml
    - vault/samba.yml
    - vault/tailscale.yml
  roles:
    - caddy
    - adguard
    - bitwarden
    - hermes
    - matrix
    - samba
    - tailscale
