- name: Configure Swarm
  hosts: swarm
  become: true
  roles:
    - swarm
    - tmux

- name: Configure Raspberry Pi 5
  hosts: raspberry-pi-5
  become: true
  vars_files:
    - vault/caddy.yml
    - vault/bitwarden.yml
    - vault/davinci.yml
    - vault/karakeep.yml
    - vault/samba.yml
    - vault/stash.yml
    - vault/tailscale.yml
    - vault/woodpecker.yml
  roles:
    - { role: caddy, caddy_version: 2.10.2 } # renovate: docker=caddy
    - { role: actual, actual_version: 25.11.0 } # renovate: docker=actualbudget/actual-server
    - { role: adguard, adguard_version: 0.107.69 } # renovate: docker=adguard/adguardhome
    - { role: bitwarden, bitwarden_version: 1.34.3 } # renovate: docker=vaultwarden/server
    - davinci
    - heimdall
    - karakeep
    - n8n
    - nextcloud
    - paperless
    - samba
    - { role: sillytavern, sillytavern_version: 1.13.5 } # renovate: docker=ghcr.io/sillytavern/sillytavern
    - stash
    - tailscale
    - woodpecker
