- name: Configure Swarm
  hosts: swarm
  become: true
  roles:
    - swarm
    - tmux

- name: Configure Raspberry Pi 4
  hosts: raspberry-pi-4
  become: true
  vars_files:
    - vault/caddy.yml
    - vault/bitwarden.yml
  roles:
    - caddy
    - adguard
    - bitwarden
    - heimdall
    - nextcloud
