networks:
  default:
    name: caddy
    external: true

volumes:
  config:

services:
  bitwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    env_file: secrets.env
    volumes:
      - config:/data
    deploy:
      labels:
        caddy: pass.echocharlie.xyz
        caddy.reverse_proxy: bitwarden:80
        caddy.import: dns
