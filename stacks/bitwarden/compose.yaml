networks:
  default:
    name: caddy
    external: true

volumes:
  config:

services:
  bitwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    env_file: secrets.env
    volumes:
      - config:/data
    deploy:
      labels:
        caddy: pass.echocharlie.xyz
        caddy.reverse_proxy: bitwarden:80
        caddy.import: dns
