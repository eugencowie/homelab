networks:
  default:
    name: caddy
    external: true

configs:
  config:
    file: configs/config.json
  homeserver:
    file: configs/homeserver.yaml

secrets:
  form_secret:
    file: secrets/form_secret
  macaroon_secret_key:
    file: secrets/macaroon_secret_key
  registration_shared_secret:
    file: secrets/registration_shared_secret
  signing_key:
    file: secrets/signing_key

volumes:
  data:

services:
  element:
    image: vectorim/element-web:v1.12.32@sha256:f8700633d4336258af7a05b53865a4f479e0d628cf2d9ca83d28b5939314d4ce
    configs:
      - source: config
        target: /app/config.json
    deploy:
      labels:
        caddy: matrix.echocharlie.xyz
        caddy.handle_0: /_matrix/*
        caddy.handle_0.reverse_proxy: synapse:8008
        caddy.handle_1: /_synapse/client/*
        caddy.handle_1.reverse_proxy: synapse:8008
        caddy.handle_2:
        caddy.handle_2.reverse_proxy: element:80
        caddy.import: dns

  synapse:
    image: matrixdotorg/synapse:v1.163.0@sha256:e98ab72138d90fa8b8876c6421fe78a9fdb181c0d7cc690ad740e5173e0c65e6
    configs:
      - source: homeserver
        target: /data/homeserver.yaml
    secrets:
      - form_secret
      - macaroon_secret_key
      - registration_shared_secret
      - signing_key
    volumes:
      - data:/data
