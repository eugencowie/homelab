networks:
  default:
    name: caddy
    external: true

configs:
  config:
    file: configs/config.yml

volumes:
  data:

services:
  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:1.19.1@sha256:660d1a23c70517fa6d5b9b76f4456ee11f002cd911007d838569e4a771a096bc
    configs:
      - source: config
        target: /home/node/app/config/config.yaml
    volumes:
      - data:/home/node/app/data
    deploy:
      labels:
        caddy: tavern.echocharlie.xyz
        caddy.reverse_proxy: sillytavern:8000
        caddy.import: dns
