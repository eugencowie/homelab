volumes:
  etc:
  lib:

services:
  samba:
    image: dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
    env_file: secrets.env
    environment:
      USERID: 0
      GROUPID: 0
      SHARE: Data;/mnt;yes;no;no;all
      GLOBAL: hide files = $$RECYCLE.BIN/System Volume Information
      SMB: 1
    ports:
      - target: 137
        published: 137
        protocol: udp
        mode: host
      - target: 138
        published: 138
        protocol: udp
        mode: host
      - target: 139
        published: 139
        mode: host
      - target: 445
        published: 445
        mode: host
    volumes:
      - etc:/etc
      - lib:/var/lib/samba
      - /mnt/wd_elements:/mnt
    tmpfs:
      - /var/cache/samba
      - /var/log/samba
      - /run/samba
