configs:
  smb:
    file: configs/smb.conf

secrets:
  users:
    file: secrets/users.conf

services:
  samba:
    image: dockurr/samba:4.23.10@sha256:2a0452a12b7a244a22f18d0f233101bb8d4952b5500ae263905e3b9dad3bf2ae
    configs:
      - source: smb
        target: /etc/samba/smb.conf
    secrets:
      - source: users
        target: /etc/samba/users.conf
    ports:
      - target: 445
        published: 445
        mode: host
    volumes:
      - /mnt/wd_elements:/shared
