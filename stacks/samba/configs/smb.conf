[global]
   server string = samba
   security = user
   map to guest = bad user
   server min protocol = SMB2
   idmap config * : range = 3000-7999

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # dperson's defaults, kept so Mac metadata and the existing .deleted recycle bin behave as before
   vfs objects = catia fruit recycle streams_xattr
   fruit:delete_empty_adfiles = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   recycle:keeptree = yes
   recycle:maxsize = 0
   recycle:repository = .deleted
   recycle:versions = yes

[Data]
   path = /shared
   browseable = yes
   read only = no
   guest ok = no
   # The NTFS mount maps every file to root anyway
   force user = root
   hide files = /$RECYCLE.BIN/System Volume Information/
