networks:
  default:
    name: caddy
    external: true

volumes:
  data:

services:
  hermes:
    image: nousresearch/hermes-agent:v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
    command: gateway run
    env_file: secrets.env
    environment:
      MATRIX_HOMESERVER: https://matrix.echocharlie.xyz
      MATRIX_USER_ID: "@hermes:matrix.echocharlie.xyz"
      MATRIX_E2EE_MODE: optional
      MATRIX_SESSION_SCOPE: room
      GATEWAY_ALLOW_ALL_USERS: "true"
    volumes:
      - data:/opt/data
    deploy:
      labels:
        caddy: bot.echocharlie.xyz
        caddy.reverse_proxy: hermes:9120
        caddy.import: dns
