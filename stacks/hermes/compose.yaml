networks:
  default:
    name: caddy
    external: true

volumes:
  data:

services:
  hermes:
    image: nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    command: gateway run
    env_file: secrets.env
    environment:
      HERMES_DASHBOARD: "true"
      MATRIX_HOMESERVER: https://matrix.echocharlie.xyz
      MATRIX_USER_ID: "@hermes:matrix.echocharlie.xyz"
      MATRIX_E2EE_MODE: optional
      MATRIX_SESSION_SCOPE: room
      GATEWAY_ALLOW_ALL_USERS: "true"
      HINDSIGHT_MODE: local_external
      # over the shared caddy network, not through Caddy
      HINDSIGHT_API_URL: http://hindsight:8888
    volumes:
      - data:/opt/data
    deploy:
      labels:
        caddy: hermes.echocharlie.xyz
        caddy.reverse_proxy: hermes:9119
        caddy.import: dns
