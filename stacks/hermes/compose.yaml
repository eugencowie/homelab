networks:
  default:
    name: caddy
    external: true

volumes:
  data:

services:
  hermes:
    image: nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
    command: gateway run
    env_file: secrets.env
    environment:
      HERMES_DASHBOARD: "true"
      MATRIX_HOMESERVER: https://matrix.echocharlie.xyz
      MATRIX_USER_ID: "@hermes:matrix.echocharlie.xyz"
      MATRIX_E2EE_MODE: optional
      MATRIX_SESSION_SCOPE: room
      GATEWAY_ALLOW_ALL_USERS: "true"
    volumes:
      - data:/opt/data
    deploy:
      labels:
        # Dashboard on 9119, Webapp on 9120
        caddy_0: hermes.echocharlie.xyz
        caddy_0.reverse_proxy: hermes:9119
        caddy_0.import: dns
        caddy_1: bot.echocharlie.xyz
        caddy_1.reverse_proxy: hermes:9120
        caddy_1.import: dns
