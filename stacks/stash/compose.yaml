networks:
  default:
    name: caddy
    external: true

volumes:
  config:

services:
  stash:
    image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    command: "serve webdav --addr :80 Stash:"
    env_file: secrets.env
    volumes:
      - config:/config/rclone
      - /mnt/wd_elements:/data
    deploy:
      labels:
        caddy: stash.echocharlie.xyz
        caddy.reverse_proxy: stash:80
        caddy.import: dns
