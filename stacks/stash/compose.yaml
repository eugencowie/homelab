networks:
  default:
    name: caddy
    external: true

volumes:
  config:

services:
  stash:
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    command: "serve webdav --addr :80 Stash:"
    env_file: secrets.env
    volumes:
      - config:/config/rclone
      - /mnt/wd_elements:/data
    deploy:
      labels:
        caddy: stash.echocharlie.xyz
        caddy.reverse_proxy: stash:80
        caddy.import: dns
