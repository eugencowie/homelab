networks:
  default:
    name: caddy
    driver: overlay
    attachable: true

volumes:
  data:

services:
  caddy:
    image: ghcr.io/eugencowie/homelab/caddy:2.11.9@sha256:4d816ef9374f2201bc6e065e78e53d2f938f7e82e960d35d28d9773452da4b75
    env_file: secrets.env
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    labels:
      caddy.email: "{env.CADDY_EMAIL}"
      caddy_0: (dns)
      caddy_0.tls.resolvers: "1.1.1.1"
      caddy_0.tls.dns: cloudflare {env.CF_API_TOKEN}
