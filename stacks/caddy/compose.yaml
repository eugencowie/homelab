networks:
  default:
    name: caddy
    driver: overlay
    attachable: true

volumes:
  data:

services:
  caddy:
    image: ghcr.io/eugencowie/homelab/caddy:2.11.8@sha256:4a798d376fce8f5d8854108c51cee3d30a6aa1f6eaa3e2967c7c1ba6a37244cc
    env_file: secrets.env
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    labels:
      caddy.email: "{env.CADDY_EMAIL}"
      caddy_0: (dns)
      caddy_0.tls.resolvers: "1.1.1.1"
      caddy_0.tls.dns: cloudflare {env.CF_API_TOKEN}
