networks:
  default:
    name: caddy
    driver: overlay
    attachable: true

volumes:
  data:

services:
  caddy:
    image: ghcr.io/eugencowie/homelab/caddy:2.11.7@sha256:b2cbb7c1c5125798b1ed77a199ea3572f35f5b6a6338d0303f8c392cc10b0072
    env_file: secrets.env
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    labels:
      caddy.email: "{env.CADDY_EMAIL}"
      caddy_0: (dns)
      caddy_0.tls.resolvers: "1.1.1.1"
      caddy_0.tls.dns: cloudflare {env.CF_API_TOKEN}
