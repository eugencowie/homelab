secrets:
  git_access_token:
    name: dococd_git_access_token
    external: true
  sops_age_key:
    name: dococd_sops_age_key
    external: true

volumes:
  data:

services:
  dococd:
    image: ghcr.io/kimdre/doco-cd:0.129.1@sha256:9c6e7f0040056465cdbc762b608c8893c64e691d464e34928c14338a6eaf6b8f
    environment:
      POLL_CONFIG: |
        - url: https://github.com/eugencowie/homelab.git
          reference: main
          interval: 5m
      GIT_COMMIT_STATUS: "true"
      GIT_ACCESS_TOKEN_FILE: /run/secrets/git_access_token
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      TZ: Europe/London
    secrets:
      - git_access_token
      - sops_age_key
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.role == manager
      # Only dococd rolls back: a broken dococd cannot deploy its own fix, and it has
      # no migrations. Other stacks keep the default (pause) so an older image never
      # runs against data a newer one has migrated.
      update_config:
        failure_action: rollback

  prune:
    image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
    # Swarm's stopped task containers keep old, still-tagged images in use,
    # so remove them before pruning every unused image.
    command: [sh, -c, docker container prune -f && docker image prune -af]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      restart_policy:
        condition: none
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: 0 4 * * *
      cd.doco.job.execution_mode: one_off
