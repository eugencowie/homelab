secrets:
  git_access_token:
    name: dococd_git_access_token
    external: true
  sops_age_key:
    name: dococd_sops_age_key
    external: true

volumes:
  data:

services:
  dococd:
    image: ghcr.io/kimdre/doco-cd:0.130.0@sha256:174e1a8d6c239d67e127e89f9a89842119b7a6c13be8e16bfe468e31b1dd6240
    environment:
      POLL_CONFIG: |
        - url: https://github.com/eugencowie/homelab.git
          reference: main
          interval: 5m
      GIT_COMMIT_STATUS: "true"
      GIT_ACCESS_TOKEN_FILE: /run/secrets/git_access_token
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      TZ: Europe/London
    secrets:
      - git_access_token
      - sops_age_key
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    cap_drop:
      - ALL
    deploy:
      placement:
        constraints:
          - node.role == manager
      # Only dococd rolls back: a broken dococd cannot deploy its own fix, and it has
      # no migrations. Other stacks keep the default (pause) so an older image never
      # runs against data a newer one has migrated.
      update_config:
        failure_action: rollback
