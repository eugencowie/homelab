networks:
  default:
    name: caddy
    external: true

volumes:
  data:

services:
  davinci:
    image: postgres:13.23@sha256:4689940c683801b4ab839ab3b0a0a3555a5fe425371422310944e89eca7d8068
    environment:
      - POSTGRES_DB=database
      - POSTGRES_USER={{ davinci_user.username }}
      - POSTGRES_PASSWORD={{ davinci_user.password }}
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
