networks:
  default:
    name: caddy
    driver: overlay
    attachable: true

volumes:
  data:

services:
  caddy:
    image: ghcr.io/eugencowie/homelab/caddy:2.11.4@sha256:f66a9413a3e02c4f4c37ea7214d5172efd14f645dbb68912753cba03b3f16581
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "80:80"
      - "443:443"
    labels:
      caddy.email: "{{ caddy_email }}"
      caddy_0: (dns)
      caddy_0.tls.resolvers: "1.1.1.1"
      caddy_0.tls.dns: "cloudflare {{ caddy_cloudflare_token }}"
    deploy:
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
