networks:
  default:
    name: caddy
    external: true

volumes:
  data:
  search:

services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
    environment:
      - DATA_DIR=/data
      - BROWSER_WEB_URL=http://chrome:9222
      - MEILI_MASTER_KEY={{ karakeep_meili_master_key }}
      - MEILI_ADDR=http://meili:7700
      - NEXTAUTH_SECRET={{ karakeep_nextauth_secret }}
      - NEXTAUTH_URL=https://saved.echocharlie.xyz
    volumes:
      - data:/data
    deploy:
      labels:
        caddy: saved.echocharlie.xyz
        caddy.reverse_proxy: karakeep:3000
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    deploy:
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}

  meili:
    image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
    environment:
      - MEILI_MASTER_KEY={{ karakeep_meili_master_key }}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - search:/meili_data
    deploy:
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
