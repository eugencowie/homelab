networks:
  default:
    name: caddy
    external: true

volumes:
  data:
  search:

services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.31.0
    environment:
      - DATA_DIR=/data
      - BROWSER_WEB_URL=http://chrome:9222
      - MEILI_MASTER_KEY={{ karakeep_meili_master_key }}
      - MEILI_ADDR=http://meili:7700
      - NEXTAUTH_SECRET={{ karakeep_nextauth_secret }}
      - NEXTAUTH_URL=https://saved.echocharlie.xyz
    volumes:
      - data:/data
    deploy:
      labels:
        caddy: saved.echocharlie.xyz
        caddy.reverse_proxy: karakeep:3000
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}

  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    deploy:
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}

  meili:
    image: getmeili/meilisearch:v1.13.3
    environment:
      - MEILI_MASTER_KEY={{ karakeep_meili_master_key }}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - search:/meili_data
    deploy:
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
