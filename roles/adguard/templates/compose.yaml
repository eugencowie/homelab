networks:
  default:
    name: caddy
    external: true

volumes:
  config:

services:
  adguard:
    image: adguard/adguardhome:v0.107.78@sha256:1ea34eafe5dc691007946e8eaab7bf46b0de9412f39213d8c06e48b53bf9a6c5
    volumes:
      - config:/opt/adguardhome/conf
      - config:/opt/adguardhome/work
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    deploy:
      labels:
        caddy: dns.echocharlie.xyz
        caddy.reverse_proxy: adguard:80
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
