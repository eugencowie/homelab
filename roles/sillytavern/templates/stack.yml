networks:
  default:
    name: caddy
    external: true

configs:
  config:
    name: sillytavern_config
    external: true

volumes:
  data:

services:
  sillytavern:
    image: "ghcr.io/sillytavern/sillytavern:{{ sillytavern_version }}"
    configs:
      - source: config
        target: /home/node/app/config/config.yaml
    volumes:
      - data:/home/node/app/data
    deploy:
      labels:
        caddy: tavern.echocharlie.xyz
        caddy.reverse_proxy: sillytavern:8000
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_hostname }}
