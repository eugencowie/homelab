networks:
  default:
    name: caddy
    external: true

configs:
  custom-css:
    name: "openwebui_config_{{ (lookup('file', role_path + '/files/custom.css') | hash('sha256'))[:7] }}"
    external: true

volumes:
  data:

services:
  openwebui:
    image: "ghcr.io/open-webui/open-webui:v{{ openwebui_version }}-slim"
    environment:
      - RAG_EMBEDDING_ENGINE=ollama # https://docs.openwebui.com/tutorials/tips/reduce-ram-usage
      - AUDIO_STT_ENGINE=openai     # https://docs.openwebui.com/tutorials/tips/reduce-ram-usage
    configs:
      - source: custom-css
        target: /app/build/static/custom.css
    volumes:
      - data:/app/backend/data
    deploy:
      labels:
        caddy: chat.echocharlie.xyz
        caddy.reverse_proxy: openwebui:8080
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
