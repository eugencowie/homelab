networks:
  default:
    name: caddy
    external: true

volumes:
  data:
  config:

services:
  woodpecker:
    image: woodpeckerci/woodpecker-server:v3.14.1@sha256:a45d030a33b06eb77467df8c202f1bbbc0d0f972560b9872c08f11fbe60ffb5f
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_HOST=https://ci.echocharlie.xyz
      - WOODPECKER_FORGEJO=true
      - WOODPECKER_FORGEJO_URL={{ woodpecker_forgejo_url }}
      - WOODPECKER_FORGEJO_CLIENT={{ woodpecker_forgejo_client }}
      - WOODPECKER_FORGEJO_SECRET={{ woodpecker_forgejo_secret }}
      - WOODPECKER_AGENT_SECRET={{ woodpecker_agent_secret }}
    volumes:
      - data:/var/lib/woodpecker
    deploy:
      labels:
        caddy: ci.echocharlie.xyz
        caddy.reverse_proxy: woodpecker:8000
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}

  agent:
    image: woodpeckerci/woodpecker-agent:v3.14.1@sha256:bfd70b063dff208c29eb1169756f7847087a2e7a522d74bab2dd8ae26147736c
    command: agent
    environment:
      - WOODPECKER_SERVER=woodpecker:9000
      - WOODPECKER_AGENT_SECRET={{ woodpecker_agent_secret }}
    volumes:
      - config:/etc/woodpecker
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
