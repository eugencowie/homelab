networks:
  default:
    name: caddy
    external: true

volumes:
  config:

services:
  bitwarden:
    image: vaultwarden/server:1.37.2@sha256:094b5689ed81549bd293418395c7cf495ae9d960fc2d4928cef2083ef913d912
    environment:
      - "ADMIN_TOKEN={{ bitwarden_admin_token }}"
    volumes:
      - config:/data
    deploy:
      labels:
        caddy: pass.echocharlie.xyz
        caddy.reverse_proxy: bitwarden:80
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
