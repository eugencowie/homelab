networks:
  default:
    name: caddy
    external: true

volumes:
  config:

services:
  bitwarden:
    image: "vaultwarden/server:{{ bitwarden_version }}"
    environment:
      - "ADMIN_TOKEN={{ bitwarden_admin_token }}"
    volumes:
      - config:/data
    deploy:
      labels:
        caddy: pass.echocharlie.xyz
        caddy.reverse_proxy: bitwarden:80
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_hostname }}
