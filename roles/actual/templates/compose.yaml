networks:
  default:
    name: caddy
    external: true

volumes:
  data:

services:
  actual:
    image: actualbudget/actual-server:26.7.0@sha256:e18b7fbfec6157a368fad4146563f397502e9da70a120aeaeac63b4977405d1c
    volumes:
      - data:/data
    deploy:
      labels:
        caddy: money.echocharlie.xyz
        caddy.reverse_proxy: actual:5006
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
