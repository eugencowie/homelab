networks:
  default:
    name: caddy
    external: true

volumes:
  config:
  data:

services:
  blinko:
    image: blinkospace/blinko:1.8.8@sha256:31c3bc9f4fc00c82328c098c0c1120fe7fe43152a9f3cbc04b0303c32a2e60d3
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=https://notes.echocharlie.xyz
      - NEXT_PUBLIC_BASE_URL=https://notes.echocharlie.xyz
      - NEXTAUTH_SECRET={{ blinko_nextauth_secret }}
      - DATABASE_URL=postgresql://postgres:{{ blinko_postgres_password }}@postgres:5432/postgres
    volumes:
      - config:/app/.blinko
    deploy:
      labels:
        caddy: notes.echocharlie.xyz
        caddy.reverse_proxy: blinko:1111
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}

  postgres:
    image: postgres:14@sha256:156f0b253fd61366d5fc2107ad45955027d5612f695a8436ce20167f3fa79bff
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD={{ blinko_postgres_password }}
    volumes:
      - data:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
