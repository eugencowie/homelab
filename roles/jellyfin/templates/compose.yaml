networks:
  default:
    name: caddy
    external: true

volumes:
  config:
  cache:

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.6@sha256:333b647716631443a43c7fabac4b0c46b4e2f036bad19547e00958f10f721b85
    volumes:
      - config:/config
      - cache:/cache
      - /mnt/wd_elements/Media:/media
    deploy:
      labels:
        caddy: tv.echocharlie.xyz
        caddy.reverse_proxy: jellyfin:8096
        caddy.import: dns
      placement:
        constraints:
          - node.hostname == {{ ansible_facts['hostname'] }}
