[settings]
disable_backends = ["asdf"] # cannot be updated by Renovate

[tools]
age = "latest"
ansible = { version = "latest", uvx = true, uvx_args = "--with-executables-from ansible-core,ansible-lint" }
"aqua:astral-sh/uv" = "latest"
docker-compose = "latest"
jactionlint = "latest"
"pipx:cruft" = "latest"
python = "latest"
shellcheck = "latest"
sops = "latest"

[env]
# shared by all worktrees: resolves to the main checkout's vault/.password
ANSIBLE_VAULT_PASSWORD_FILE = "{{ exec(command='git rev-parse --path-format=absolute --git-common-dir') }}/../vault/.password"

[tasks.ping]
description = "Check inventory"
run = "ansible all -m ping"

[tasks.lint]
description = "Lint workflows, playbook and stacks"
depends = ["lint:*"]

[tasks."lint:actions"]
description = "Lint GitHub workflows"
run = "jactionlint"

[tasks."lint:ansible"]
description = "Lint playbook"
run = "ansible-lint site.yml"

[tasks."lint:stacks"]
description = "Validate stack compose files"
run = 'for file in stacks/*/compose.yaml; do docker-compose --file "$file" config --quiet --no-interpolate || exit 1; done'

[tasks.deploy]
description = "Run playbook"
run = "ansible-playbook site.yml"

[tasks."ssh:copy-id"]
description = "Copy SSH key to host"
usage = 'arg "<host>"'
run = 'ssh-copy-id "$usage_host"'

[tasks."vault:password"]
description = "Set the Vault password"
shell = "bash -c" # required for `read -rsp`
run = 'read -rsp "Vault password: " password && echo && (umask 077 && printf "%s\n" "$password" > "$ANSIBLE_VAULT_PASSWORD_FILE")'

[tasks."vault:decrypt"]
description = "Decrypt a Vault file"
usage = 'arg "<file>"'
run = 'ansible-vault decrypt "$usage_file"'

[tasks."vault:encrypt"]
description = "Encrypt a Vault file"
usage = 'arg "<file>"'
run = 'ansible-vault encrypt "$usage_file"'

[tasks."age:keygen"]
description = "Create your SOPS age key, unless it exists, and print its public key"
run = '''
key="${XDG_CONFIG_HOME:-$HOME/.config}/sops/age/keys.txt"
if [ ! -e "$key" ]; then
  mkdir -p "$(dirname "$key")"
  age-keygen --output "$key"
fi
age-keygen -y "$key"
'''

[tasks."secrets:edit"]
description = "Create or edit a SOPS-encrypted file"
usage = 'arg "<file>"'
run = 'sops edit "$usage_file"'

[tasks."template:update"]
description = "Update project with the latest changes from the template"
run = "cruft update"

[tasks."template:restore"]
description = "Restore template-managed files"
run = "cruft diff | git apply"
